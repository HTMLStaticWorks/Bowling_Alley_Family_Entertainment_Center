<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrikeZone | Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;450;500;520;540;580&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D81B60'><circle cx='12' cy='12' r='10'/><circle cx='9' cy='9' r='1.5' fill='%23fff'/><circle cx='15' cy='9' r='1.5' fill='%23fff'/><circle cx='12' cy='14' r='1.5' fill='%23fff'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background-color: var(--bg-color); }
        .auth-page-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
        .auth-card { width: 100%; max-width: 480px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 2.5rem 2rem; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .auth-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.75rem; }
        .divider-text { display: flex; align-items: center; gap: 0.75rem; color: #aaa; font-size: 0.85rem; margin: 1.25rem 0; }
        .divider-text::before, .divider-text::after { content: ''; flex: 1; height: 1px; background: var(--border-color); }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 0.65rem; width: 100%; padding: 0.7rem 1rem; border-radius: 8px; border: 1.5px solid var(--border-color); background: transparent; color: var(--text-color); font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
        .social-btn:hover { background: var(--bg-color); border-color: #aaa; }
        .auth-top-controls { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 999; }
    </style>
</head>
<body>
    <div class="auth-top-controls">
        <button class="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill fs-5"></i></button>
        <button class="rtl-toggle-btn" aria-label="Toggle RTL">RTL</button>
    </div>

    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="index.html">
                    <img src="assets/images/logo.svg" alt="StrikeZone Logo" style="max-width: 210px; max-height: 50px; width: 100%;">
                </a>
                <p class="text-muted mt-2 mb-0 small">Create your account and start having fun!</p>
            </div>

            <form id="registerForm" novalidate onsubmit="handleRegister(event)">
                <!-- Full Name -->
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-bold small">Full Name</label>
                    <input type="text" class="form-control form-control-lg" id="fullName" placeholder="John Doe" required>
                    <div class="invalid-feedback">Please enter your full name.</div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="regEmail" class="form-label fw-bold small">Email Address</label>
                    <input type="email" class="form-control form-control-lg" id="regEmail" placeholder="you@example.com" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="regPassword" class="form-label fw-bold small">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="Create a password" required minlength="8">
                        <button class="btn btn-outline-secondary" type="button" id="toggleRegPass" aria-label="Toggle password visibility">
                            <i class="bi bi-eye" id="regEyeIcon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">Password must be at least 8 characters.</div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-bold small">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-lg" id="confirmPassword" placeholder="Repeat your password" required>
                        <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPass" aria-label="Toggle confirm password visibility">
                            <i class="bi bi-eye" id="confirmEyeIcon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="confirmError">Passwords do not match.</div>
                </div>

                <!-- Sign Up Button -->
                <button type="submit" class="btn btn-primary w-100 btn-lg py-2 mb-3">Sign Up</button>

                <!-- Social Login (below signup button) -->
                <div class="divider-text">or continue with</div>
                <div class="d-flex flex-column gap-2 mb-3">
                    <button class="social-btn" type="button">
                        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.09-6.09C34.36 3.1 29.47 1 24 1 14.62 1 6.64 6.73 3.18 14.8l7.08 5.5C11.89 14.31 17.44 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.58 24.5c0-1.6-.14-3.15-.41-4.64H24v8.79h12.74c-.55 2.97-2.22 5.49-4.72 7.18l7.27 5.65C43.41 37.61 46.58 31.55 46.58 24.5z"/>
                            <path fill="#FBBC05" d="M10.26 28.3A14.53 14.53 0 0 1 9.5 24c0-1.49.25-2.94.7-4.3L3.12 14.2A23.95 23.95 0 0 0 1 24c0 3.84.92 7.47 2.55 10.68l7.71-6.38z"/>
                            <path fill="#34A853" d="M24 47c5.47 0 10.06-1.81 13.41-4.91l-7.27-5.65c-1.82 1.22-4.16 1.94-6.14 1.94-6.56 0-12.11-4.81-13.74-11.08l-7.71 6.38C6.64 41.27 14.62 47 24 47z"/>
                        </svg>
                        Continue with Google
                    </button>
                    <button class="social-btn" type="button">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.37c1.32.07 2.24.74 3.01.8 1.14-.23 2.23-.9 3.44-.76 1.46.18 2.56.83 3.24 2.1-2.96 1.78-2.26 5.65.31 6.71-.59 1.51-1.31 3.02-2 4.06zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                        </svg>
                        Continue with Apple
                    </button>
                </div>

                <p class="text-center small text-muted mb-0">
                    Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') { input.type = 'text'; icon.classList.replace('bi-eye', 'bi-eye-slash'); }
            else { input.type = 'password'; icon.classList.replace('bi-eye-slash', 'bi-eye'); }
        }
        document.getElementById('toggleRegPass').addEventListener('click', () => togglePass('regPassword', 'regEyeIcon'));
        document.getElementById('toggleConfirmPass').addEventListener('click', () => togglePass('confirmPassword', 'confirmEyeIcon'));

        function handleRegister(e) {
            e.preventDefault();
            const form = document.getElementById('registerForm');
            const pass = document.getElementById('regPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
            if (pass !== confirm) {
                document.getElementById('confirmPassword').classList.add('is-invalid');
                document.getElementById('confirmError').style.display = 'block';
                return;
            }
            alert('Account created successfully! Redirecting to login...');
        }
    </script>
</body>
</html>
