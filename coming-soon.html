<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrikeZone | Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;450;500;520;540;580&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D81B60'><circle cx='12' cy='12' r='10'/><circle cx='9' cy='9' r='1.5' fill='%23fff'/><circle cx='15' cy='9' r='1.5' fill='%23fff'/><circle cx='12' cy='14' r='1.5' fill='%23fff'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .coming-soon-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1.5rem;
            background: linear-gradient(135deg, rgba(216,27,96,0.06), rgba(30,136,229,0.06));
        }
        .countdown-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            min-width: 80px;
        }
        .countdown-box .num { font-size: 2.5rem; font-weight: 580; color: var(--primary-color); line-height: 1; }
        .countdown-box .label { font-size: 0.75rem; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
        .auth-top-controls { position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 999; }
    </style>
</head>
<body>

    <!-- Fixed Theme & RTL controls (no standard header for this page) -->
    <div class="auth-top-controls">
        <button class="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill fs-5"></i></button>
        <button class="rtl-toggle-btn" aria-label="Toggle RTL">RTL</button>
    </div>

    <section class="coming-soon-wrapper">
        <div class="col-lg-7 mx-auto">

            <!-- Logo -->
            <a href="index.html" class="d-inline-block mb-4">
                <img src="assets/images/logo.svg" alt="StrikeZone Logo" style="max-width: 210px; max-height: 50px; width: 100%;">
            </a>

            <h1 class="display-4 fw-bold mb-3">Something Big is Coming!</h1>
            <p class="lead text-muted mb-5 mx-auto" style="max-width: 520px;">
                We're busy adding new lanes, new games, and new surprises to StrikeZone. Sign up below to be the first to know when we go live.
            </p>

            <!-- Countdown Timer -->
            <div class="d-flex justify-content-center gap-3 flex-wrap mb-5">
                <div class="countdown-box">
                    <div class="num" id="days">30</div>
                    <div class="label">Days</div>
                </div>
                <div class="countdown-box">
                    <div class="num" id="hours">00</div>
                    <div class="label">Hours</div>
                </div>
                <div class="countdown-box">
                    <div class="num" id="minutes">00</div>
                    <div class="label">Minutes</div>
                </div>
                <div class="countdown-box">
                    <div class="num" id="seconds">00</div>
                    <div class="label">Seconds</div>
                </div>
            </div>

            <!-- Email Notify Form -->
            <form class="d-flex justify-content-center gap-2 flex-wrap mb-4" onsubmit="event.preventDefault(); alert('You\'ll be notified!');">
                <input type="email" class="form-control form-control-lg" style="max-width: 320px;" placeholder="Enter your email address" required>
                <button type="submit" class="btn btn-primary btn-lg px-4">Notify Me</button>
            </form>

            <a href="index.html" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Go back to homepage
            </a>

            <!-- Social Links -->
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a href="#" class="text-muted fs-4"><i class="bi bi-facebook"></i></a>
                <a href="#" class="text-muted fs-4"><i class="bi bi-twitter-x"></i></a>
                <a href="#" class="text-muted fs-4"><i class="bi bi-instagram"></i></a>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Countdown to 30 days from now
        const target = new Date();
        target.setDate(target.getDate() + 30);

        function updateCountdown() {
            const now = new Date();
            const diff = target - now;
            if (diff <= 0) return;

            document.getElementById('days').textContent    = String(Math.floor(diff / 86400000)).padStart(2, '0');
            document.getElementById('hours').textContent   = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
            document.getElementById('minutes').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
            document.getElementById('seconds').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
