<!DOCTYPE html>
<html lang="en" data-bs-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrikeZone | Login</title>
    <meta name="description" content="Login to your StrikeZone account to manage bookings and more.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;450;500;520;540;580&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D81B60'><circle cx='12' cy='12' r='10'/><circle cx='9' cy='9' r='1.5' fill='%23fff'/><circle cx='15' cy='9' r='1.5' fill='%23fff'/><circle cx='12' cy='14' r='1.5' fill='%23fff'/></svg>">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        .auth-page-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5rem 1rem 2rem 1rem;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2.5rem 2rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .auth-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.75rem;
        }

        .divider-text {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #aaa;
            font-size: 0.85rem;
            margin: 1.25rem 0;
        }
        .divider-text::before,
        .divider-text::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 1.5px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .social-btn:hover {
            background: var(--bg-color);
            border-color: #aaa;
        }

        /* Fixed toggles top-right */
        .auth-top-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.5rem;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Fixed Theme & RTL Toggles (top-right, no standard header) -->
    <div class="auth-top-controls">
        <button class="theme-toggle-btn" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill fs-5"></i></button>
        <button class="rtl-toggle-btn" aria-label="Toggle RTL">RTL</button>
    </div>

    <!-- Login Form Centered -->
    <div class="auth-page-wrapper">
        <div class="auth-card">

            <!-- Logo inside card -->
            <div class="auth-logo">
                <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="var(--primary-color)" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" />
                        <circle cx="9" cy="9" r="1.5" fill="#fff" />
                        <circle cx="15" cy="9" r="1.5" fill="#fff" />
                        <circle cx="12" cy="14" r="1.5" fill="#fff" />
                    </svg>
                    <span class="fw-bold fs-4 text-body">StrikeZone</span>
                </a>
                <p class="text-muted mt-2 mb-0 small">Welcome back! Please sign in to continue.</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate onsubmit="handleLogin(event)">

                <!-- Email -->
                <div class="mb-3">
                    <label for="loginEmail" class="form-label fw-bold small">Email Address</label>
                    <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="you@example.com" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="loginPassword" class="form-label fw-bold small">Password</label>
                    <div class="position-relative">
                        <input type="password" class="form-control form-control-lg" id="loginPassword" placeholder="Enter your password" required style="padding-right: 3rem;">
                        <button class="btn border-0 position-absolute end-0 top-50 translate-middle-y text-muted" type="button" id="togglePassword" aria-label="Toggle password visibility" style="z-index: 10;">
                            <i class="bi bi-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback d-block" id="passError" style="display:none!important;"></div>
                </div>

                <!-- Remember Me + Forgot Password (same line) -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="small text-primary text-decoration-none fw-bold">Forgot Password?</a>
                </div>

                <!-- Login Button (same width as fields) -->
                <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
                    Login
                </button>

                <!-- Social Login (below login button) -->
                <div class="divider-text">or continue with</div>
                <div class="d-flex flex-column gap-2 mb-3">
                    <button class="social-btn" type="button" onclick="return false;">
                        <svg width="20" height="20" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.85l6.09-6.09C34.36 3.1 29.47 1 24 1 14.62 1 6.64 6.73 3.18 14.8l7.08 5.5C11.89 14.31 17.44 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.58 24.5c0-1.6-.14-3.15-.41-4.64H24v8.79h12.74c-.55 2.97-2.22 5.49-4.72 7.18l7.27 5.65C43.41 37.61 46.58 31.55 46.58 24.5z"/>
                            <path fill="#FBBC05" d="M10.26 28.3A14.53 14.53 0 0 1 9.5 24c0-1.49.25-2.94.7-4.3L3.12 14.2A23.95 23.95 0 0 0 1 24c0 3.84.92 7.47 2.55 10.68l7.71-6.38z"/>
                            <path fill="#34A853" d="M24 47c5.47 0 10.06-1.81 13.41-4.91l-7.27-5.65c-1.82 1.22-4.16 1.94-6.14 1.94-6.56 0-12.11-4.81-13.74-11.08l-7.71 6.38C6.64 41.27 14.62 47 24 47z"/>
                        </svg>
                        Continue with Google
                    </button>
                    <button class="social-btn" type="button" onclick="return false;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.37c1.32.07 2.24.74 3.01.8 1.14-.23 2.23-.9 3.44-.76 1.46.18 2.56.83 3.24 2.1-2.96 1.78-2.26 5.65.31 6.71-.59 1.51-1.31 3.02-2 4.06zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                        </svg>
                        Continue with Apple
                    </button>
                </div>

                <!-- Signup Link -->
                <p class="text-center small text-muted mb-0">
                    Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none">Sign Up</a>
                </p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // Password visibility toggle
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('loginPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // Form validation
        function handleLogin(e) {
            e.preventDefault();
            const form = document.getElementById('loginForm');
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }
            alert('Login successful! Redirecting...');
        }
    </script>
</body>
</html>
